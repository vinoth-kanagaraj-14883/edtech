global:
  imagePullPolicy: IfNotPresent
  environment: development
  otelExporterOtlpEndpoint: http://otel-collector.monitoring.svc.cluster.local:4317
  jwtSecret: change-me-in-production
  database:
    postgres:
      host: postgres.edtech.svc.cluster.local
      port: 5432
      username: edtech
      password: edtech_password
      adminDatabase: edtech
      userDatabase: userdb
      courseDatabase: coursedb
    mysql:
      host: mysql.edtech.svc.cluster.local
      port: 3306
      username: edtech
      password: edtech_password
      database: contentdb
    redis:
      url: redis://redis.edtech.svc.cluster.local:6379
      password: ""
  ingress:
    annotations: {}
  observability:
    enabled: true
    prometheusScrape: true

apiGateway:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/vinoth-kanagaraj-14883/edtech-api-gateway
    tag: latest
  containerPort: 8080
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    USER_SERVICE_URL: http://user-service:8001
    COURSE_SERVICE_URL: http://course-service:8002
    CONTENT_SERVICE_URL: http://content-service:8003
    QUIZ_SERVICE_URL: http://quiz-service:8004
    NOTIFICATION_SERVICE_URL: http://notification-service:8005
    SEARCH_SERVICE_URL: http://search-service:8006
    PAYMENT_SERVICE_URL: http://payment-service:8007
    TRACKING_SERVICE_URL: http://tracking-service:8008
    CERTIFICATION_SERVICE_URL: http://certification-service:8009
    OTEL_SERVICE_NAME: edtech-api-gateway
    OTEL_RESOURCE_ATTRIBUTES: deployment.environment=development
  probes:
    liveness:
      path: /health
    readiness:
      path: /health
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

userService:
  enabled: true
  replicas: 2

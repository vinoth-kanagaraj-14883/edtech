# Dedicated chaos server. Runs with a namespaced ServiceAccount + RBAC so its
# Kubernetes chaos scenarios (pod-kill, stress, network-partition, bad-deploy)
# can act on workloads in this namespace. Application scenarios need only Redis.
chaosService:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/vinoth-kanagaraj-14883/edtech-chaos-service
    tag: latest
  containerPort: 8090
  service:
    # NodePort so the dashboard is reachable on a dedicated port during demos.
    type: NodePort
    port: 8090
    nodePort: 30890
  rbac:
    create: true
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    CHAOS_PORT: "8090"
    REDIS_ADDR: redis.edtech.svc.cluster.local:6379
    KUBE_NAMESPACE: edtech
    OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector.monitoring.svc.cluster.local:4317
  probes:
    liveness:
      path: /health
    readiness:
      path: /health

frontend:
  enabled: true
  replicas: 2
  image:
    repository: ghcr.io/vinoth-kanagaraj-14883/edtech-frontend
    tag: latest
  containerPort: 3000
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi
  env:
    NEXT_PUBLIC_API_URL: http://api-gateway:8080
    NODE_ENV: production
  probes:
    liveness:
      path: /
    readiness:
      path: /
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: edtech.local
      paths:
        - path: /
          pathType: Prefix
          service: frontend
          port: 3000
        - path: /api
          pathType: Prefix
          service: api-gateway
          port: 8080

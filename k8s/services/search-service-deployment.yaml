apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: edtech
  labels:
    app: search-service
    version: v1
    component: service
    part-of: edtech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
        version: v1
        component: service
        part-of: edtech
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8006"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: search-service
      containers:
        - name: search-service
          image: edtech/search-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8006
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: PORT
              value: "8006"
            - name: COURSE_SERVICE_URL
              value: http://course-service.edtech.svc.cluster.local:8002
            - name: REDIS_URL
              value: redis://redis.edtech.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: HOT_COURSE_LIMIT
              value: "500"
            - name: HOT_REFRESH_MS
              value: "60000"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.monitoring.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_SERVICE_NAME
              value: search-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=search-service,service.version=v1,deployment.environment=production
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: edtech
  labels:
    app: search-service
    version: v1
    component: service
    part-of: edtech
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
    - name: http
      port: 8006
      targetPort: http

apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
    part-of: edtech
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/rules/recording-rules.yml
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']

      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          # Normalize the `job` label to the app name so the shared recording
          # rules and Grafana dashboards work identically in Compose and k8s.
          # Prefer an explicit `prometheus.io/job` annotation, falling back to
          # the standard `app`/`app.kubernetes.io/name` pod labels.
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_job]
            action: replace
            target_label: job
            regex: (.+)
          - source_labels: [job, __meta_kubernetes_pod_label_app]
            action: replace
            regex: kubernetes-pods;(.+)
            target_label: job
            replacement: $1
          - source_labels: [job, __meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            regex: kubernetes-pods;(.+)
            target_label: job
            replacement: $1

      - job_name: kubernetes-services
        kubernetes_sd_configs:
          - role: service
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__

      - job_name: kubernetes-nodes
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: node-exporter

      - job_name: kube-state-metrics
        static_configs:
          - targets: ['kube-state-metrics.monitoring.svc.cluster.local:8080']

      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector.monitoring.svc.cluster.local:9464']
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-recording-rules
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
    part-of: edtech
data:
  recording-rules.yml: |
    groups:
      - name: edtech-service-red-metrics
        interval: 15s
        rules:
          # Normalized RED metrics keyed by the `job` label (see the
          # Compose observability/recording-rules.yml for full commentary).
          # Request rate (req/s, 5m)
          - record: edtech:request_rate:job
            expr: sum by (job) (rate(api_gateway_http_requests_total[5m]))
            labels: { job: api-gateway }
          - record: edtech:request_rate:job
            expr: sum by (job) (rate(user_service_http_requests_total[5m]))
            labels: { job: user-service }
          - record: edtech:request_rate:job
            expr: sum(rate(http_server_requests_seconds_count[5m]))
            labels: { job: course-service }
          - record: edtech:request_rate:job
            expr: sum(rate(http_requests_total{service="content-service"}[5m]))
            labels: { job: content-service }
          - record: edtech:request_rate:job
            expr: sum(rate(quiz_service_http_requests_total[5m]))
            labels: { job: quiz-service }
          - record: edtech:request_rate:job
            expr: sum(rate(notification_service_http_requests_total[5m]))
            labels: { job: notification-service }
          # Error rate (fraction of 5xx, 5m)
          - record: edtech:error_rate:job
            expr: sum(rate(api_gateway_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(api_gateway_http_requests_total[5m])), 1)
            labels: { job: api-gateway }
          - record: edtech:error_rate:job
            expr: sum(rate(user_service_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(user_service_http_requests_total[5m])), 1)
            labels: { job: user-service }
          - record: edtech:error_rate:job
            expr: sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1)
            labels: { job: course-service }
          - record: edtech:error_rate:job
            expr: sum(rate(http_requests_total{service="content-service",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{service="content-service"}[5m])), 1)
            labels: { job: content-service }
          - record: edtech:error_rate:job
            expr: sum(rate(quiz_service_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(quiz_service_http_requests_total[5m])), 1)
            labels: { job: quiz-service }
          - record: edtech:error_rate:job
            expr: sum(rate(notification_service_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(notification_service_http_requests_total[5m])), 1)
            labels: { job: notification-service }
          # p99 latency (seconds, 5m)
          - record: edtech:latency_p99:job
            expr: histogram_quantile(0.99, sum by (le) (rate(api_gateway_http_request_duration_seconds_bucket[5m])))
            labels: { job: api-gateway }
          - record: edtech:latency_p99:job
            expr: histogram_quantile(0.99, sum by (le) (rate(user_service_http_request_duration_seconds_bucket[5m])))
            labels: { job: user-service }
          - record: edtech:latency_p99:job
            expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))
            labels: { job: course-service }
          - record: edtech:latency_p99:job
            expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{service="content-service"}[5m])))
            labels: { job: content-service }
          - record: edtech:latency_p99:job
            expr: histogram_quantile(0.99, sum by (le) (rate(quiz_service_http_request_duration_seconds_bucket[5m])))
            labels: { job: quiz-service }
          - record: edtech:latency_p99:job
            expr: histogram_quantile(0.99, sum by (le) (rate(notification_service_http_request_duration_seconds_bucket[5m])))
            labels: { job: notification-service }
          # p50 latency (seconds, 5m)
          - record: edtech:latency_p50:job
            expr: histogram_quantile(0.50, sum by (le) (rate(api_gateway_http_request_duration_seconds_bucket[5m])))
            labels: { job: api-gateway }
          - record: edtech:latency_p50:job
            expr: histogram_quantile(0.50, sum by (le) (rate(user_service_http_request_duration_seconds_bucket[5m])))
            labels: { job: user-service }
          - record: edtech:latency_p50:job
            expr: histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))
            labels: { job: course-service }
          - record: edtech:latency_p50:job
            expr: histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{service="content-service"}[5m])))
            labels: { job: content-service }
          - record: edtech:latency_p50:job
            expr: histogram_quantile(0.50, sum by (le) (rate(quiz_service_http_request_duration_seconds_bucket[5m])))
            labels: { job: quiz-service }
          - record: edtech:latency_p50:job
            expr: histogram_quantile(0.50, sum by (le) (rate(notification_service_http_request_duration_seconds_bucket[5m])))
            labels: { job: notification-service }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: monitoring
  labels:
    app: prometheus
    component: monitoring
    part-of: edtech
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    version: v1
    component: monitoring
    part-of: edtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        version: v1
        component: monitoring
        part-of: edtech
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-recording-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    version: v1
    component: monitoring
    part-of: edtech
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http

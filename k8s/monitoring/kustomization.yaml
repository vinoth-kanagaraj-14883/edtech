apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Standalone monitoring stack. Apply with:
#   kubectl apply -k k8s/monitoring
#
# The Grafana dashboard ConfigMap is generated from the SAME dashboard JSON
# files that Docker Compose mounts (monitoring/grafana/dashboards/*), so the
# local and Kubernetes dashboards never drift.
resources:
  - otel-collector-deployment.yaml
  - prometheus-deployment.yaml
  - grafana-deployment.yaml
  - jaeger-deployment.yaml
  - loki-deployment.yaml
  - node-exporter-daemonset.yaml
  - kube-state-metrics-deployment.yaml

configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - ../../monitoring/grafana/dashboards/edtech-overview.json
      - ../../monitoring/grafana/dashboards/edtech-service-detail.json

generatorOptions:
  disableNameSuffixHash: true

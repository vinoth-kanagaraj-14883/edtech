apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - serviceaccounts/serviceaccounts.yaml
  - rbac/rbac.yaml
  - configmaps/app-config.yaml
  - secrets/app-secrets.yaml
  - databases/postgresql-statefulset.yaml
  - databases/mysql-statefulset.yaml
  - databases/redis-statefulset.yaml
  - services/api-gateway-deployment.yaml
  - services/user-service-deployment.yaml
  - services/course-service-deployment.yaml
  - services/content-service-deployment.yaml
  - services/quiz-service-deployment.yaml
  - services/notification-service-deployment.yaml
  - services/search-service-deployment.yaml
  - services/frontend-deployment.yaml
  - monitoring/otel-collector-deployment.yaml
  - monitoring/prometheus-deployment.yaml
  - monitoring/grafana-deployment.yaml
  - monitoring/jaeger-deployment.yaml
  - monitoring/loki-deployment.yaml
  - monitoring/node-exporter-daemonset.yaml
  - monitoring/kube-state-metrics-deployment.yaml
  - ingress/ingress.yaml
  - hpa/hpa.yaml
  - poddisruptionbudgets/pdb.yaml
  - networkpolicies/networkpolicy.yaml

# Grafana dashboard JSON is generated into a ConfigMap from the shared,
# single-source-of-truth dashboard files under monitoring/grafana/dashboards/
# (the same files mounted by Docker Compose), so Compose and k8s never drift.
configMapGenerator:
  - name: grafana-dashboards
    namespace: monitoring
    files:
      - ../../monitoring/grafana/dashboards/edtech-overview.json
      - ../../monitoring/grafana/dashboards/edtech-service-detail.json
      - ../../monitoring/grafana/dashboards/edtech-http-l7.json
      - ../../monitoring/grafana/dashboards/edtech-infra-nodes.json
      - ../../monitoring/grafana/dashboards/edtech-infra-k8s.json
      - ../../monitoring/grafana/dashboards/edtech-app-runtime.json
      - ../../monitoring/grafana/dashboards/edtech-slo.json

generatorOptions:
  disableNameSuffixHash: true

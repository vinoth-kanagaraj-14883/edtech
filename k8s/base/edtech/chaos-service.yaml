apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-service
  namespace: edtech
  labels:
    app: chaos-service
    part-of: edtech
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chaos-service
  namespace: edtech
  labels:
    app: chaos-service
    part-of: edtech
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "delete", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chaos-service
  namespace: edtech
  labels:
    app: chaos-service
    part-of: edtech
subjects:
  - kind: ServiceAccount
    name: chaos-service
    namespace: edtech
roleRef:
  kind: Role
  name: chaos-service
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-service
  namespace: edtech
  labels:
    app: chaos-service
    version: v1
    component: chaos
    part-of: edtech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chaos-service
  template:
    metadata:
      labels:
        app: chaos-service
        version: v1
        component: chaos
        part-of: edtech
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: chaos-service
      containers:
        - name: chaos-service
          image: edtech/chaos-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: CHAOS_PORT
              value: "8090"
            - name: REDIS_ADDR
              value: redis.edtech.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: KUBE_NAMESPACE
              value: edtech
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector.monitoring.svc.cluster.local:4317
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chaos-service
  namespace: edtech
  labels:
    app: chaos-service
    part-of: edtech
spec:
  # NodePort so the chaos dashboard is reachable on a dedicated port in demos.
  type: NodePort
  selector:
    app: chaos-service
  ports:
    - name: http
      port: 8090
      targetPort: http
      nodePort: 30890

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: edtech
  labels:
    app: payment-service
    version: v1
    component: service
    part-of: edtech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
        version: v1
        component: service
        part-of: edtech
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8007"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: payment-service
          image: edtech/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8007
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: PAYMENT_DB_PASSWORD
            - name: DATABASE_URL
              value: "postgresql://payment_service:$(PAYMENT_DB_PASSWORD)@postgresql.edtech.svc.cluster.local:5432/payment_service"
            - name: USER_SERVICE_URL
              value: http://user-service.edtech.svc.cluster.local:8001
            - name: COURSE_SERVICE_URL
              value: http://course-service.edtech.svc.cluster.local:8002
            - name: NOTIFICATION_SERVICE_URL
              value: http://notification-service.edtech.svc.cluster.local:8005
            - name: REDIS_ADDR
              value: redis.edtech.svc.cluster.local:6379
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: REDIS_PASSWORD
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: otel-collector.monitoring.svc.cluster.local:4317
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: edtech
  labels:
    app: payment-service
    version: v1
    component: service
    part-of: edtech
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8007
      targetPort: http

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['api-gateway:8080']

  - job_name: user-service
    metrics_path: /metrics
    static_configs:
      - targets: ['user-service:8001']

  - job_name: course-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['course-service:8002']

  - job_name: content-service
    metrics_path: /metrics
    static_configs:
      - targets: ['content-service:8003']

  - job_name: quiz-service
    metrics_path: /metrics
    static_configs:
      - targets: ['quiz-service:8004']

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets: ['notification-service:8005']

  - job_name: search-service
    metrics_path: /metrics
    static_configs:
      - targets: ['search-service:8006']

  - job_name: payment-service
    metrics_path: /metrics
    static_configs:
      - targets: ['payment-service:8007']

  - job_name: tracking-service
    metrics_path: /metrics
    static_configs:
      - targets: ['tracking-service:8008']

  - job_name: certification-service
    metrics_path: /metrics
    static_configs:
      - targets: ['certification-service:8009']

  - job_name: chaos-service
    metrics_path: /metrics
    static_configs:
      - targets: ['chaos-service:8090']

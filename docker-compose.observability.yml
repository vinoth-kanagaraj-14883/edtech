services:
  api-gateway:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

  user-service:
    environment:
      OTLP_ENDPOINT: otel-collector:4317

  course-service:
    environment:
      # Java OTLP HTTP exporter -> collector HTTP port 4318
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

  content-service:
    environment:
      # Node OTLP HTTP exporter -> collector HTTP port 4318
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

  quiz-service:
    environment:
      # Ruby OTLP HTTP exporter -> collector HTTP port 4318
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

  notification-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

  search-service:
    environment:
      # Node OTLP HTTP exporter -> collector HTTP port 4318
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

  payment-service:
    environment:
      # Python gRPC exporter -> collector gRPC port 4317
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

  tracking-service:
    environment:
      # Node OTLP HTTP exporter -> collector HTTP port 4318
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

  certification-service:
    environment:
      # Python gRPC exporter -> collector gRPC port 4317
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

  chaos-service:
    environment:
      # Python gRPC exporter -> collector gRPC port 4317
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317

  frontend:
    environment:
      # Consumed SERVER-SIDE by the Next.js proxy route
      # (app/api/proxy/[...path]/route.ts) when forwarding browser-emitted
      # spans, so this must be the Docker-internal collector address, not a
      # browser-facing one (the browser always POSTs to the same-origin
      # `/api/proxy/otel/...` path, never directly to this URL).
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    container_name: edtech-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./observability/otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: edtech-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/recording-rules.yml:/etc/prometheus/recording-rules.yml:ro
      # The detection layer. Without this mount Prometheus starts but fails to
      # load its rule_files entry, so no alert can ever fire.
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: edtech-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Auto-open the overview dashboard as the landing page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/edtech-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.59
    container_name: edtech-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      # Jaeger's OTLP receiver binds to `localhost` by default, which only
      # accepts connections from inside its own container. Bind to all
      # interfaces so otel-collector (a separate container) can reach it.
      COLLECTOR_OTLP_GRPC_HOST_PORT: "0.0.0.0:4317"
      COLLECTOR_OTLP_HTTP_HOST_PORT: "0.0.0.0:4318"
      # Service Performance Monitoring (Monitor tab): read RED metrics
      # (derived from spans by the otel-collector's spanmetrics connector)
      # from Prometheus.
      METRICS_STORAGE_TYPE: prometheus
      PROMETHEUS_SERVER_URL: http://prometheus:9090
      # The collector's prometheus exporter appends `_total`/duration-unit
      # suffixes to metric names; tell Jaeger to look for those instead of
      # the bare `calls`/`duration_bucket` names.
      PROMETHEUS_QUERY_NORMALIZE_CALLS: "true"
      PROMETHEUS_QUERY_NORMALIZE_DURATION: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"
      - "14250:14250"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "4319:4317"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: edtech-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"

  # Always-on load generator: continuously drives the realistic learner journey
  # (demo/load-continuous.js) through the api-gateway so the Jaeger service map,
  # Prometheus RED metrics, and Grafana dashboards stay populated with fresh
  # distributed traces without any manual `make load-test` runs.
  #
  # It targets the gateway via the Docker-internal address (api-gateway:8080),
  # so when the demo overlay repoints the gateway at Toxiproxy the injected
  # faults show up in this continuous traffic automatically.
  loadgen:
    image: grafana/k6:0.52.0
    container_name: edtech-loadgen
    # k6 exits when its run window ends, so the restart policy is what makes the
    # traffic continuous. `always` rather than `unless-stopped` so it also comes
    # back after a Docker daemon or host restart — this generator is meant to be
    # running whenever the stack is up.
    #
    # If you ever see no traffic on the dashboards, check this container first:
    #   docker logs --tail 30 edtech-loadgen
    # A script syntax error surfaces as exit code 107 in a tight restart loop.
    # Validate script changes with k6 itself, not node:
    #   docker run --rm -v "$PWD/demo:/scripts:ro" grafana/k6:0.52.0 \
    #     inspect /scripts/load-continuous.js
    restart: always
    environment:
      API_URL: ${LOADGEN_API_URL:-http://api-gateway:8080}
      VUS: ${LOADGEN_VUS:-10}
      DURATION: ${LOADGEN_DURATION:-24h}
    volumes:
      - ./demo/load-continuous.js:/scripts/load-continuous.js:ro
    command: ["run", "/scripts/load-continuous.js"]
    depends_on:
      api-gateway:
        condition: service_started

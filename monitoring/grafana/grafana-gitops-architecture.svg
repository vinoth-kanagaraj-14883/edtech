<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Grafana dashboards deployed with GitOps</title>
  <desc id="description">Dashboard JSON and PromQL queries flow from a Git pull request through GitHub Actions and Kustomize into a live Grafana instance backed by Prometheus metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081225"/>
      <stop offset="1" stop-color="#13294b"/>
    </linearGradient>
    <linearGradient id="gitPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233c"/>
      <stop offset="1" stop-color="#203659"/>
    </linearGradient>
    <linearGradient id="clusterPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b46"/>
      <stop offset="1" stop-color="#12405d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#5cc8ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#ff9f43"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#5ee6a8"/>
    </marker>
    <style>
      .heading { font: 700 38px Inter,Segoe UI,sans-serif; fill: #f5f9ff }
      .subtitle { font: 400 18px Inter,Segoe UI,sans-serif; fill: #a9bdd7 }
      .section { font: 700 20px Inter,Segoe UI,sans-serif; fill: #dcecff; letter-spacing: 1.5px }
      .box-title { font: 700 21px Inter,Segoe UI,sans-serif; fill: #f7fbff }
      .box-copy { font: 400 15px Inter,Segoe UI,sans-serif; fill: #bcd0e8 }
      .code { font: 500 13px ui-monospace,SFMono-Regular,Consolas,monospace; fill: #d5e8ff }
      .label { font: 600 14px Inter,Segoe UI,sans-serif; fill: #9ddcff }
      .metric { font: 500 12px ui-monospace,SFMono-Regular,Consolas,monospace; fill: #bff7dc }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="230" fill="#1f6b9b" opacity=".12"/>
  <circle cx="80" cy="850" r="260" fill="#f58b3a" opacity=".08"/>

  <text x="70" y="68" class="heading">Grafana Architecture — Dashboards as Code</text>
  <text x="70" y="101" class="subtitle">Git is the source of truth · PromQL is versioned with every panel · CI/CD provisions the live dashboard</text>

  <rect x="55" y="140" width="720" height="680" rx="24" fill="url(#gitPanel)" stroke="#34537b" stroke-width="2"/>
  <text x="85" y="180" class="section">GITOPS DELIVERY PLANE</text>

  <g filter="url(#shadow)">
    <rect x="95" y="225" width="270" height="150" rx="18" fill="#172b48" stroke="#5cc8ff" stroke-width="2"/>
    <circle cx="135" cy="265" r="18" fill="#5cc8ff"/>
    <path d="M127 266h16M135 258v16" stroke="#081225" stroke-width="3" stroke-linecap="round"/>
    <text x="165" y="272" class="box-title">Dashboard author</text>
    <text x="125" y="313" class="box-copy">Creates and reviews panels locally</text>
    <text x="125" y="342" class="code">JSON model + PromQL expressions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="465" y="215" width="270" height="170" rx="18" fill="#172b48" stroke="#a77bff" stroke-width="2"/>
    <path d="M505 250v42m0-31h31m-31 20h31" fill="none" stroke="#a77bff" stroke-width="4" stroke-linecap="round"/>
    <circle cx="505" cy="250" r="6" fill="#a77bff"/>
    <circle cx="536" cy="261" r="6" fill="#a77bff"/>
    <circle cx="536" cy="281" r="6" fill="#a77bff"/>
    <text x="560" y="262" class="box-title">Git repository</text>
    <text x="495" y="319" class="code">monitoring/grafana/dashboards/</text>
    <text x="495" y="347" class="box-copy">Pull request · review · merge</text>
  </g>

  <path d="M365 300h85" stroke="#5cc8ff" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="379" y="286" class="label">commit</text>

  <g filter="url(#shadow)">
    <rect x="225" y="465" width="380" height="145" rx="18" fill="#172b48" stroke="#5cc8ff" stroke-width="2"/>
    <circle cx="278" cy="516" r="22" fill="none" stroke="#5cc8ff" stroke-width="4"/>
    <path d="M278 494v44M256 516h44" stroke="#5cc8ff" stroke-width="3" opacity=".7"/>
    <text x="320" y="516" class="box-title">GitHub Actions</text>
    <text x="320" y="544" class="box-copy">Deploy after merge to main</text>
    <text x="255" y="582" class="code">kubectl apply -k k8s/overlays/$ENV</text>
  </g>

  <path d="M600 385v42c0 22-18 40-40 40" stroke="#5cc8ff" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="614" y="432" class="label">merge triggers</text>

  <g filter="url(#shadow)">
    <rect x="225" y="680" width="380" height="95" rx="18" fill="#172b48" stroke="#5cc8ff" stroke-width="2"/>
    <text x="255" y="719" class="box-title">Kustomize rendering</text>
    <text x="255" y="748" class="code">dashboard JSON → ConfigMap</text>
  </g>
  <path d="M415 610v55" stroke="#5cc8ff" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="825" y="140" width="720" height="680" rx="24" fill="url(#clusterPanel)" stroke="#287493" stroke-width="2"/>
  <text x="855" y="180" class="section">LIVE KUBERNETES OBSERVABILITY PLANE</text>

  <path d="M605 728h285c25 0 45-20 45-45v-20" stroke="#5cc8ff" stroke-width="4" fill="none" marker-end="url(#arrowBlue)"/>
  <text x="681" y="714" class="label">declarative apply</text>

  <g filter="url(#shadow)">
    <rect x="875" y="220" width="285" height="135" rx="18" fill="#123451" stroke="#5cc8ff" stroke-width="2"/>
    <path d="M913 257h34v45h-34zM920 266h20M920 276h20M920 286h14" fill="none" stroke="#5cc8ff" stroke-width="3"/>
    <text x="970" y="270" class="box-title">Dashboard ConfigMap</text>
    <text x="905" y="320" class="code">grafana-dashboards</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1210" y="220" width="285" height="135" rx="18" fill="#123451" stroke="#ff9f43" stroke-width="2"/>
    <path d="M1252 251c-19 10-28 31-18 50 6 12 20 20 34 18 18-2 31-17 30-34-1-16-12-25-22-31 3 9 0 17-7 22 0-13-6-21-17-25z" fill="#ff9f43"/>
    <text x="1310" y="270" class="box-title">Grafana</text>
    <text x="1310" y="299" class="box-copy">File provisioning provider</text>
    <text x="1240" y="329" class="code">/var/lib/grafana/dashboards</text>
  </g>

  <path d="M1160 287h35" stroke="#ff9f43" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <text x="1153" y="270" class="label">mount</text>

  <g filter="url(#shadow)">
    <rect x="875" y="450" width="285" height="155" rx="18" fill="#123451" stroke="#e65252" stroke-width="2"/>
    <circle cx="928" cy="505" r="25" fill="#e65252"/>
    <path d="M913 511l10-14 9 9 12-17" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="970" y="500" class="box-title">Prometheus</text>
    <text x="905" y="550" class="box-copy">Scrapes and stores time series</text>
    <text x="905" y="578" class="code">prometheus:9090</text>
  </g>

  <path d="M1350 355v88c0 35-28 63-63 63h-112" stroke="#ff9f43" stroke-width="4" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="1250" y="425" class="label">PromQL query</text>
  <path d="M1175 548h105c39 0 70-31 70-70v-108" stroke="#5ee6a8" stroke-width="4" stroke-dasharray="9 7" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="1210" y="570" class="metric">time-series result</text>

  <g filter="url(#shadow)">
    <rect x="875" y="680" width="620" height="95" rx="18" fill="#123451" stroke="#5ee6a8" stroke-width="2"/>
    <text x="905" y="719" class="box-title">EduForge workloads and exporters</text>
    <text x="905" y="749" class="metric">/metrics · API Gateway · services · kube-state-metrics · node-exporter</text>
  </g>
  <path d="M1017 680v-60" stroke="#5ee6a8" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="1033" y="650" class="label">scrape</text>

  <rect x="885" y="382" width="255" height="42" rx="10" fill="#0d253d" stroke="#4e718e"/>
  <text x="902" y="408" class="metric">rate(http_requests_total[5m])</text>

  <g transform="translate(70 850)">
    <circle cx="8" cy="0" r="6" fill="#5cc8ff"/>
    <text x="22" y="5" class="box-copy">delivery flow</text>
    <circle cx="160" cy="0" r="6" fill="#ff9f43"/>
    <text x="174" y="5" class="box-copy">query flow</text>
    <circle cx="285" cy="0" r="6" fill="#5ee6a8"/>
    <text x="299" y="5" class="box-copy">metrics flow</text>
  </g>
  <text x="1530" y="855" text-anchor="end" class="subtitle">No manual dashboard drift</text>
</svg>

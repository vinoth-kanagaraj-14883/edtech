default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch('DB_POOL', 5) %>
  username: <%= ENV.fetch('DB_USER', 'edtech') %>
  password: "<%= ENV.fetch('DB_PASSWORD', 'edtech_password') %>"
  database: <%= ENV.fetch('DB_NAME', 'quizdb') %>
  ssl_mode: :disabled
<% if ENV['DB_SOCKET'] && !ENV['DB_SOCKET'].strip.empty? %>
  # Unix socket connections never negotiate TLS (no network transport to
  # encrypt), sidestepping MariaDB Connector/C's opportunistic-TLS-over-TCP
  # behavior entirely. `host` must be omitted here: mysql2/MariaDB Connector
  # only uses the socket path when host is blank/"localhost" -- a non-empty
  # host value forces a TCP connection regardless of the socket option.
  socket: <%= ENV['DB_SOCKET'] %>
<% else %>
  host: <%= ENV.fetch('DB_HOST', 'mysql') %>
  port: <%= ENV.fetch('DB_PORT', 3306) %>
<% end %>

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
